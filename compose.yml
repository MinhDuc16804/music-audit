# Chạy app bằng: docker compose up -d --build
# Cổng chỉ mở cho chính máy này vì app không có trang đăng nhập riêng. Cho nhân viên vào qua Cloudflare Tunnel và Access, xem web/README.md.

services:
  music-audit:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Ghi đè đường dẫn trên máy dev nếu .env có.
      FFMPEG_LOCATION: /usr/bin/ffmpeg
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Kết quả quét đã lưu, giữ lại khi cập nhật để không tốn lượt AudD lần nữa.
      - music-audit-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  music-audit-data:
